### ============================================================

### model
model_name_or_path: /mnt/beegfs/workspace/scy/yizhigao/LIMA/models/Qwen3-8B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json   # 官方模板(相对 LF 根, 同原 z3 用法); 2026-09-05 提速: 8B@8×H200 显存充裕, 不需要 z3 的逐 microstep 全参 all-gather
flash_attn: fa2                  # 2026-09-05 提速: flash-attn 2.8.3 预编译 wheel (cu12torch2.8/cxx11abiTRUE/cp312); 长序列 SDPA→FA2
enable_liger_kernel: true        # 2026-09-05 提速: fused linear CE 免物化 32K×151936 logits; 1.7B 同数据已验证数学等价

### dataset
dataset: spbench_sft
dataset_dir: data                # 相对 LLaMA-Factory 根目录
template: qwen3
mask_history: true               # history 不计入 loss（论文同）
cutoff_len: 32768                # spbench 全长 p50=18994/p90=30847; 32768=Qwen3 官方上限, 实测 100% 保留
max_samples: 1000000             # = 全量 26534
overwrite_cache: true
preprocessing_num_workers: 16    # 仅预处理并行, 不改训练语义; 2.6万条 × 32K token 单进程 tokenize 需数小时
dataloader_num_workers: 8        # 2026-09-05 提速: bs=1 时 worker 只 collate 单条样本, 8 卡各自独立 dataloader, 8 无压力

### output
output_dir: models/qwen3-8b/spbench_sft
logging_steps: 10
save_steps: 26
plot_loss: true
overwrite_output_dir: false      # 续跑必须 false: true 会跳过自动 resume 从头重训
save_only_model: false           # 存完整训练状态可断点续训(~114G/ckpt × 4)
report_to: tensorboard
save_strategy: steps

### train（对齐论文/基线, 偏离项见头部表）
per_device_train_batch_size: 4
gradient_accumulation_steps: 8  # 八卡 effective batch = 8×4×8 = 256（= 原文 8卡×1×32, 不变）
learning_rate: 1.0e-6
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### gradient checkpointing（2026-09-05 实测验证）
# 不显式设置 = LF 默认自动开启（disable_gradient_checkpointing=False）
# 实测: 8B@32K 无 ckpt 激活峰值 ~172G（外推），超单卡 141G 必 OOM
# 激活显存斜率: 4.75 G / 1K tokens（8K→24K 线性实测）
# 开 ckpt 后: 32K 峰值 34.4G（冒烟实测），代价 ~30% 计算（重算激活）
# 结论: ckpt 必须保持开启，这是 8B@32K 的硬约束，非可调优项
