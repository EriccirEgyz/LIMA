### ============================================================
### spbench_v1 SFT @ Qwen3-8B — Less-is-More 实验 1 的 8B 版
### 姊妹配置: llamafactory_runs/qwen3-1.7b_full/spbench_sft.yaml (1.7B 同数据)
### 基线血统: 配方逐字源自 EnvFactory 论文 configs/llamafactory_sft.yaml
###
### 相对 1.7B spbench 配置的偏离（供对照实验报告引用）:
###   | 参数                        | 1.7B 值                     | 本配置                        | 原因 |
###   |----------------------------|-----------------------------|-------------------------------|------|
###   | model_name_or_path          | models/Qwen3-1.7B           | models/Qwen3-8B               | 实验变量本身（规模对照） |
###   | gradient_accumulation_steps | 256(单卡)                   | 32(八卡)                      | 8×1×32=256 保持 effective batch 不变 |
###   | num_train_epochs            | 3(论文同)                   | 3(论文同)                     | 2026-09-05 曾议调 4, 终定 3（与论文/在跑 job 一致, 避免多余偏离） |
###   | gradient_checkpointing      | true(后注释掉)              | 不写=自动开启                  | LF 源码默认 disable_gradient_checkpointing=False 自动开(在跑 job 日志可证); 8B@32K 无 ckpt 激活 ~140G 必 OOM; 代价 ~30% 已含在冒烟 7.2s 内 |
###   | enable_liger_kernel         | true                        | true                          | 2026-09-05 起 gyz_sft 已装 liger-kernel 0.8.2; fused CE 免物化 32K×151936 logits |
###   | flash_attn                  | 无                          | fa2                           | 2026-09-05 提速: flash-attn 2.8.3 wheel; 长序列 SDPA→FA2（冒烟实测单 token 算力 ~4×） |
###   | deepspeed                   | ds_z3_config.json           | ds_z2_config.json(官方模板)   | 2026-09-05 提速: 8B@8×H200 显存充裕(~50G/卡), ZeRO-3 每 microstep 全参 all-gather 纯亏 |
###   | save_strategy              | steps(13)                   | steps(52)                     | ~1/6 epoch 一存, 含优化器 ~114G/个 可断点续训 |
###   其余参数（dataset/template/mask_history/cutoff/batch/lr/调度器/bf16）与 1.7B spbench 配置逐字相同。
###
### ⚡ 2026-09-05 12:30 提速重启（历史: 首轮 4卡+z3+SDPA 无liger 1081s/step, ETA 90h, 单卡 MFU~8%）:
###   根因: ① 只用4卡(4-7 空闲未用) ② SDPA 长序列慢 ③ ZeRO-3 每 microstep 16G×2 参数 all-gather 且
###   overlap_comm=false ④ 无 liger, 每 microstep 物化 32K×151936 logits。
###   冒烟(GPU7): FA2+liger+ckpt 32K fwd+bwd 7.2s（34.4G 峰值）→ 算力侧 ~4×; 乘 8 卡 2×, 预期 150-300s/step。
###   effective batch 256 / lr / 调度器 / epochs / 数据语义全部不变, 仅提速不改数学。
