### 显存预估: 1.7B 全参 ZeRO-3 + 32K 序列 + 梯度检查点, H100 80G 余量充足
### （若未来关检查点试速, 先盯着 nvidia-smi, 32K 激活无 ckpt 大概率 OOM）
### ============================================================

### model
model_name_or_path: /workspace/shenchengyu/yizhigao/LIMA/models/Qwen3-1.7B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_config.json   # 相对 LLaMA-Factory 根目录

### dataset
dataset: spbench_sft
dataset_dir: data                # 相对 LLaMA-Factory 根目录
template: qwen3
mask_history: true               # history 不计入 loss（论文同）
cutoff_len: 32768                # 必要偏离: 见头部 diff 表; = Qwen3-1.7B 官方上下文上限
max_samples: 1000000             # 论文同（= 全量）
overwrite_cache: true
preprocessing_num_workers: 16    # 偏离基线(1): 仅加速 tokenize, 不改训练语义
dataloader_num_workers: 1        # 论文同

### 激活内存优化（必要偏离: 32K 序列激活翻倍, 16K 无 ckpt 已 ~47G）
# gradient checkpointing会额外耗时30%-40%，显存足够时可以关闭
#gradient_checkpointing: true
#gradient_checkpointing_kwargs:
#  use_reentrant: false           # ZeRO-3 兼容写法（同 examples/train_full 官方示例）
enable_liger_kernel: true        # fused linear CE: 不物化 32K×151936 的 fp32 logits(~18.6G), 数学等价, 见头部 diff 表

### output（与基线策略一致）
output_dir: models/qwen3-1.7b/spbench_sft
logging_steps: 10                # 论文同
save_steps: 13                   
plot_loss: true                  # 论文同
overwrite_output_dir: false      # 断点续跑必须 false（同基线注释: true 会跳过自动 resume 重头训）
save_only_model: false           # 论文同（存完整训练状态，可断点续训）
report_to: tensorboard           # 论文同
save_strategy: steps             

### train（对齐论文/基线）
per_device_train_batch_size: 1   # 论文同
gradient_accumulation_steps: 256 # 单卡 effective batch=256（= 原文 8卡×1×32）
learning_rate: 1.0e-6            # 论文同
num_train_epochs: 3              # 论文同
lr_scheduler_type: cosine        # 论文同
warmup_ratio: 0.1                # 论文同
bf16: true                       # 论文同
ddp_timeout: 180000000           # 论文同（单卡无害）
