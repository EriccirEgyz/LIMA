### ============================================================
### spbench_v1 SFT — 与 EnvFactory 基线对照（Less-is-More 实验 1）
### 基线: llamafactory_runs/qwen3-1.7b_full/sft.yaml (env_factory_sft)
### 训练配方与基线逐字对齐，仅改 dataset + 为适配数据长度/仓库自含
### 所做的必要偏离（全部列在下表，供对照实验报告引用）:
###
###   | 参数                       | 基线值        | 本配置       | 原因                          |
###   |---------------------------|--------------|-------------|-------------------------------|
###   | dataset                   | env_factory_sft | spbench_sft | 实验变量本身                  |
###   | cutoff_len                | 16384        | 32768       | spbench 全长 p50=18994/p90=30847; 32768=Qwen3-1.7B 官方上限。超长处理(2026-08-29 读码+tokenize缓存实测纠正): 非 packing 下 LLaMA-Factory 不丢样本——mask_history 倒序装填, 最后一轮(loss区+EOS)完整, 截掉最老历史; 32768 实测 100% 保留, 1896 条(7.15%)截历史; 若用 16384 则 59% 样本的上下文被砍(终轮回复引用的早期工具结果丢失)。旧注"整条丢63.8%"系误述(源自 rollout_to_sft.py 旧打印) |
###   | gradient_checkpointing    | 无           | true        | 16K 无 ckpt ~47G(H100 80G), 32K 激活翻倍必须开; 代价: 慢 ~30-40% |
###   | model_name_or_path        | envfactory_repro/models/Qwen3-1.7B | LIMA/models/Qwen3-1.7B | 同一份权重, 改用 LIMA 仓库自有拷贝使其自含可复现 |
###   | output_dir                | models/qwen3-1.7b/env_factory_sft | models/qwen3-1.7b/spbench_sft | 与基线配对命名 |
###   | preprocessing_num_workers | 1            | 16          | 仅预处理并行, 不改任何训练语义; ~2.3万条 × 32K token 单进程 tokenize 需数小时 |
###   | enable_liger_kernel       | 无           | true        | fused CE 分块计算消灭 18.55G fp32 logits 峰值(32K×151936词表×4B); 数学等价仅换内核, 使共享GPU(空余~58G)可跑 |
###   其余参数（template/mask_history/batch/lr/epochs/调度器/bf16/ZeRO-3/保存策略）与基线逐字相同。
###
